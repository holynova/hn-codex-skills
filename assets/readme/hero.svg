<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">HN Codex Skills — 个人精选 Codex 技能体系</title>
  <desc id="desc">深色终端风标题：HN Codex Skills，个人精选 Codex 技能体系；右侧是终端窗口，显示 npx 一键安装命令与 26 个技能的分类统计。</desc>

  <rect width="1200" height="360" rx="26" fill="#12161c"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8fa3c8">CODEX SKILLS · 个人精选工作流沉淀</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#e8eef7">HN Codex Skills</text>
    <text x="56" y="168" font-size="23" fill="#c6d4e8">高频工程与创作工作流，一次沉淀、处处复用</text>
    <text x="56" y="204" font-size="19" fill="#8fa3c8">发布、界面打磨、艺术创作、系统诊断——26 个技能。</text>
    <g id="chips" font-size="18" fill="#e8eef7" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="119" y="262">26 个技能</text></g>
      <g><rect x="194" y="238" width="150" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="269" y="262">npx 一键安装</text></g>
      <g><rect x="356" y="238" width="110" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="411" y="262">Node 18+</text></g>
      <g><rect x="478" y="238" width="126" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="541" y="262">白名单校验</text></g>
    </g>
    <text x="56" y="316" font-size="17" fill="#8fa3c8">6 个重叠技能已归档至 backup/，安装器拦截误装</text>
  </g>

  <g id="terminal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="780" y="36" width="370" height="150" rx="12" fill="#0b0e12" stroke="#2a3340" stroke-width="1.5"/>
    <circle cx="802" cy="58" r="5" fill="#e5484d"/>
    <circle cx="818" cy="58" r="5" fill="#f5c518"/>
    <circle cx="834" cy="58" r="5" fill="#3fb950"/>
    <text x="798" y="96" font-size="15" fill="#5eead4">$ npx github:holynova/hn-codex-skills</text>
    <text x="798" y="122" font-size="15" fill="#5eead4">  install</text>
    <text x="798" y="158" font-size="15" fill="#8fa3c8">26 skills installed -&gt; ~/.codex/skills</text>
  </g>

  <g id="categories" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">
    <g>
      <rect x="780" y="212" width="12" height="12" rx="3" fill="#5eead4"/>
      <text x="802" y="224" fill="#e8eef7">启动交付 × 3</text>
      <rect x="910" y="212" width="12" height="12" rx="3" fill="#5b9dff"/>
      <text x="932" y="224" fill="#e8eef7">界面打磨 × 6</text>
    </g>
    <g>
      <rect x="780" y="252" width="12" height="12" rx="3" fill="#f5a623"/>
      <text x="802" y="264" fill="#e8eef7">内容创作 × 12</text>
      <rect x="910" y="252" width="12" height="12" rx="3" fill="#c084fc"/>
      <text x="932" y="264" fill="#e8eef7">数据分享 × 2</text>
    </g>
    <g>
      <rect x="780" y="292" width="12" height="12" rx="3" fill="#3fb950"/>
      <text x="802" y="304" fill="#e8eef7">系统诊断 × 3</text>
      <rect x="910" y="292" width="12" height="12" rx="3" fill="#8a94a6"/>
      <text x="932" y="304" fill="#e8eef7">归档 × 6（禁装）</text>
    </g>
    <text x="780" y="340" font-size="17" fill="#8fa3c8">技能即 SKILL.md：规则、例图与脚本一次写好</text>
  </g>
</svg>
